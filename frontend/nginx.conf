server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api-gateway:8080;     # no trailing slash: the full /api/... path is forwarded unchanged
    proxy_http_version 1.1;
    proxy_set_header Host $host;            # pass the original host name to the gateway
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri /index.html;             # React Router fallback (as before)
  }
}