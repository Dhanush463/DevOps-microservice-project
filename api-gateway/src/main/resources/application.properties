# Server Configuration
server.port=8080

# Application Configuration
spring.application.name=api-gateway

# Global CORS Configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns[0]=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns[1]=http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns[2]=http://*:30080
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600

# Employee Service Route
spring.cloud.gateway.routes[0].id=employee-service
spring.cloud.gateway.routes[0].uri=${EMPLOYEE_SERVICE_URL:http://employee-service:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/employees/**

# Department Service Route
spring.cloud.gateway.routes[1].id=department-service
spring.cloud.gateway.routes[1].uri=${DEPARTMENT_SERVICE_URL:http://department-service:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/departments/**

# Leave Service Route
spring.cloud.gateway.routes[2].id=leave-service
spring.cloud.gateway.routes[2].uri=${LEAVE_SERVICE_URL:http://leave-service:8083}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/leaves/**

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true